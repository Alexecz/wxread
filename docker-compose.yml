services:
  wxread:
    build: .
    image: wxread:local
    container_name: wxread
    restart: unless-stopped
    # 所有配置（curl、推送 token、CRON_SCHEDULE 等）写在同目录 .env 中，参考 .env.example
    env_file: .env
    environment:
      TZ: "Asia/Shanghai"
      # 若 .env 未设置 WXREAD_CURL_BASH，则从 curl.txt 读取
      WXREAD_CURL_FILE: /app/curl.txt
    volumes:
      - ./curl.txt:/app/curl.txt:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
